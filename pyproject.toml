[project]
name = "pyfake"
version = "0.0.13"
description = "A fake data generator that is pydantic compatible."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6", "pydantic[email,timezone]>=2.12.5"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pranesh Mukhopadhyay", email = "praneshmukherjee7@gmail.com" },
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
]
keywords = [
    "pydantic",
    "fake data",
    "data generation",
    "data validation",
    "data modeling",
    "synthetic data",
    "timeseries data",
]

[project.urls]
Homepage = "https://github.com/Mukhopadhyay/pyfake"
Documentation = "https://mukhopadhyay.is-a.dev/pyfake/"
Repository = "https://github.com/Mukhopadhyay/pyfake"
Issues = "https://github.com/Mukhopadhyay/pyfake/issues"
Changelog = "https://mukhopadhyay.is-a.dev/pyfake/CHANGELOG/"

[dependency-groups]
dev = [
    "marimo>=0.17.6",
    "matplotlib>=3.10.8",
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "rich>=14.3.1",
    "ruff>=0.17.2",
]
docs = ["termynal>=0.14.0", "zensical>=0.0.27"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pyfake --cov-report=term-missing --strict-markers"
markers = [
    "datatypes: Unit tests for all datatypes together.",
    "integer: All integer related tests, generator + pydantic integration.",
    "boolean: All boolean related tests, generator + pydantic integration.",
    "string: All string related tests, generator + pydantic integration.",
    "float: All float related tests, generator + pydantic integration.",
    "decimal: All decimal related tests, generator + pydantic integration.",
    "uuid: All UUID related tests, generator + pydantic integration.",
    "datetime: All datetime related tests, generator + pydantic integration.",
    "pyfake: All pyfake core generator tests.",
    "api: Tests for the main `Pyfake` class",
    "registry: All pyfake registry GeneratorRegistry() related tests.",
    "exceptions: Tests for pyfake exception classes.",
    "complex: Tests for complex types (list, set, tuple, dict, enum, literal, nested models).",
]

[build-system]
requires = ["setuptools>=77"]
build-backend="setuptools.build_meta"


[tool.coverage.run]
branch = true
source = ["pyfake"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.setuptools.packages.find]
include = ["pyfake*"]
exclude = ["notebooks*", "site*", "tests*"]

[tool.setuptools.package-data]
pyfake = ["py.typed"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# select = [...]  # See the Default Rules page for the full listing.
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[\\p{XID_Continue}]*[\\p{XID_Continue}--_]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
